name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # git-lfs is on GitHub runners already; git is too. Both are needed by
      # the Smart HTTP / browse tests, which shell out to them.
      - name: Verify git tooling
        run: git --version && git lfs version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The Firestore emulator needs a JRE; firebase-tools ships the emulator.
      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firestore emulator
        run: npm install -g firebase-tools

      # ~35 test files skip themselves unless FIRESTORE_EMULATOR_HOST is set.
      # emulators:exec starts the emulator, runs the tests, and tears it down,
      # failing the job on a non-zero test exit.
      - name: Test (with Firestore emulator)
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8084
        run: |
          firebase emulators:exec \
            --only firestore \
            --project git-bucket-79382 \
            'go test -race ./...'

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
